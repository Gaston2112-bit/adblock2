name: Compilar APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Descomprimir proyecto
        run: unzip -o proyecto.zip -d proyecto
      - name: Compilar
        working-directory: proyecto
        run: gradle assembleDebug --no-daemon
      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "apk-${{ github.run_number }}" proyecto/app/build/outputs/apk/debug/app-debug.apk --title "AdBlock ${{ github.run_number }}" --notes "APK compilado"
